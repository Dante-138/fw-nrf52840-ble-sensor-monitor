# ============================================
# nRF52840 BLE Sensor Monitor - Kconfig
# ============================================

# ----- Bluetooth -----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF52840_Sensor"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# ----- GPIO (LEDs + Botoes) -----
CONFIG_GPIO=y

# ----- Sensor (temperatura interna) -----
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# ----- ADC (tensao VDD via SAADC) -----
CONFIG_ADC=y

# ----- Console (UART via J-Link VCOM) -----
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# ----- Logging -----
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# ----- Float no printk -----
CONFIG_CBPRINTF_FP_SUPPORT=y

# ----- Sistema -----
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
